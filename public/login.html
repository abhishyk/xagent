<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Sign in · xagent</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/manrope.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="login-page">
  <main class="login-card" aria-labelledby="login-title">
    <div class="brand brand-lg">
      <svg class="brand-mark robot" viewBox="0 0 32 32" aria-hidden="true"><line class="r-line" x1="16" y1="4" x2="16" y2="8.5" stroke-width="2" stroke-linecap="round"/><circle class="r-bulb" cx="16" cy="3.4" r="2.3"/><rect class="r-body" x="2" y="14.5" width="3.2" height="7" rx="1.6"/><rect class="r-body" x="26.8" y="14.5" width="3.2" height="7" rx="1.6"/><rect class="r-body" x="4.5" y="8" width="23" height="20" rx="7"/><rect class="r-visor" x="8" y="12.5" width="16" height="10" rx="5"/><rect class="r-eye" x="11.3" y="15" width="3" height="5" rx="1.5"/><rect class="r-eye" x="17.7" y="15" width="3" height="5" rx="1.5"/></svg>
      <h1 id="login-title">Xagent</h1>
    </div>
    <p class="muted login-sub">Internal technical assistant. Authorized users only.</p>

    <form id="login-form" novalidate>
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" required maxlength="64" autofocus>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256">

      <p id="login-error" class="form-error" role="alert" hidden></p>

      <button id="login-btn" class="btn btn-primary btn-block" type="submit">Login</button>
    </form>
  </main>
  <script src="/login.js"></script>
</body>
</html>

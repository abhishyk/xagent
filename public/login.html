<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Sign in · xagent</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="login-page">
  <main class="login-card" aria-labelledby="login-title">
    <div class="brand brand-lg">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2 4 7v8c0 7.2 5 13.4 12 15 7-1.6 12-7.8 12-15V7L16 2Z" fill="none" stroke="currentColor" stroke-width="2"/><path d="m11 16 3.5 3.5L21.5 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <h1 id="login-title">xagent</h1>
    </div>
    <p class="muted login-sub">Internal technical assistant. Authorized users only.</p>

    <form id="login-form" novalidate>
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" required maxlength="64" autofocus>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256">

      <p id="login-error" class="form-error" role="alert" hidden></p>

      <button id="login-btn" class="btn btn-primary btn-block" type="submit">Login</button>
    </form>
  </main>
  <script src="/login.js"></script>
</body>
</html>
